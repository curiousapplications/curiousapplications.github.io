team:
  heading: Behind the curtains
  subheading: At Curious Applications, the "we" is "me"
  members:
    - name: Chris Conover
      role: Principal, Accountant
      img: /img/team/ChrisProfilePhoto.jpg
      bio: |
        Hi! I'm Chris Conover, do-er of all things at Curious Applications. I have over 20 years of industry experience and a background in computer science. Since 2013, I have been helping clients bring their apps to life on iOS, from startups to Fortune 500 companies in healthcare, FinTech, social, and medical devices. I build the foundation other engineers build on: clean architecture, code generation, and connected-hardware apps that stay reliable on real devices. I use AI tools for planning, prototyping, and code generation, and I validate and own everything that ships.

        Working on something? I'd love to hear about it.
      

